[package]
name = "agave-block-production-scheduler-load-test"
description = "Load-testing harness for the Agave block-production scheduler"
documentation = "https://docs.rs/agave-block-production-scheduler-load-test"
version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg=docsrs"]

[dependencies]
agave-block-production-scheduler = { workspace = true }
agave-logger = { workspace = true }
agave-scheduler-bindings = { workspace = true }
agave-scheduling-utils = { workspace = true }
agave-votor-messages = { workspace = true }
clap = { workspace = true }
crossbeam-channel = { workspace = true }
jemallocator = { workspace = true }
log = { workspace = true }
rts-alloc = { workspace = true }
shaq = { workspace = true }
signal-hook = { workspace = true }
solana-account = { workspace = true }
solana-core = { workspace = true }
solana-clock = { workspace = true }
solana-epoch-schedule = { workspace = true }
solana-fee-calculator = { workspace = true }
solana-hash = { workspace = true }
solana-message = { workspace = true }
solana-ledger = { workspace = true }
solana-leader-schedule = { workspace = true }
solana-poh = { workspace = true }
solana-poh-config = { workspace = true }
solana-pubkey = { workspace = true }
solana-runtime = { workspace = true, features = ["dev-context-only-utils"] }
solana-sdk-ids = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
solana-system-interface = { workspace = true }
solana-transaction = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
wincode = { workspace = true }

[lints]
workspace = true
